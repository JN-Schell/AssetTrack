services:
  db:
    image: postgres:16-alpine
    container_name: assettrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assettrack}
      POSTGRES_USER: ${POSTGRES_USER:-assettrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assettrack_secure_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assettrack} -d ${POSTGRES_DB:-assettrack}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assettrack-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assettrack}:${POSTGRES_PASSWORD:-assettrack_secure_password_123}@db:5432/${POSTGRES_DB:-assettrack}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_to_a_secure_random_key_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      MEDIA_ROOT: /app/media
    volumes:
      - media_data:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assettrack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
    name: assettrack_postgres_data
  media_data:
    name: assettrack_media_data
